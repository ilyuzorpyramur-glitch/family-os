name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        working-directory: apps/android
        run: >-
          gradle :app:testChildDebugUnitTest
          :app:assembleChildDebug
          :app:assembleParentDebug
          --no-daemon --stacktrace

      - name: Upload child APK
        uses: actions/upload-artifact@v4
        with:
          name: family-os-child-debug
          path: apps/android/app/build/outputs/apk/child/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload parent APK
        uses: actions/upload-artifact@v4
        with:
          name: family-os-parent-debug
          path: apps/android/app/build/outputs/apk/parent/debug/*.apk
          if-no-files-found: error
          retention-days: 30
